# Publica a imagem do Exchange no Docker Hub (garciapp/exchange) sem precisar de Docker local.
# Mesmas etapas do Jenkinsfile: testes + pip-audit (estágio test do Dockerfile), Trivy barrando
# HIGH/CRITICAL com correção e build para linux/amd64 e linux/arm64.
#
# Precisa de um secret no repositório: DOCKERHUB_TOKEN (Docker Hub > Account settings >
# Personal access tokens, permissão Read & Write). O usuário é fixo: garciapp.
name: publicar imagem
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGEM: garciapp/exchange
  # sem o secret, roda só testes, pip-audit e Trivy (não falha por falta de login)
  TEM_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: testes e pip-audit (estágio test)
        run: docker build --pull --target test -t exchange:test .

      - name: Trivy na imagem final
        run: |
          docker build -t exchange:scan .
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.1/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.76.1
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 exchange:scan

      - uses: docker/setup-qemu-action@v4.4.0
        if: env.TEM_TOKEN == 'true'
      - uses: docker/setup-buildx-action@v4.4.1
        if: env.TEM_TOKEN == 'true'
      - uses: docker/login-action@v4.7.0
        if: env.TEM_TOKEN == 'true'
        with:
          username: garciapp
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: tag curta do commit
        if: env.TEM_TOKEN == 'true'
        run: echo "SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7.4.0
        if: env.TEM_TOKEN == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ env.SHA }}
